name: CI

on:
  # PR branches are verified by pull_request; push covers main only, so each
  # PR commit runs once instead of once per event.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Verify (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run audit
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run validate
        if: runner.os == 'macOS'
      - run: npm run lint:raycast
        if: runner.os == 'macOS'
      - run: npm run smoke
      - run: npm run pack
      - uses: actions/upload-artifact@v7
        with:
          name: synapsed-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.streamDeckPlugin
            dist/*.rayext
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
