[workspace]
members = [
    "crates/synapsed-api",
    "crates/synapsed-core",
    "crates/synapsed-ddc",
    "crates/synapsed-plugins",
    "crates/synapsed",
    "crates/synapsed-client",
    "crates/synapsectl",
    "apps/macos-tray",
]
default-members = ["crates/synapsed", "crates/synapsed-client", "crates/synapsectl"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "=1.2.3", features = ["derive"] }
tokio = { version = "=1.54.1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
