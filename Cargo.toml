[workspace]
members = [
    "crates/synapsed-api",
    "crates/synapsed-core",
    "crates/synapsed-ddc",
    "crates/synapsed-bluetooth",
    "crates/synapsed-plugins",
    "crates/synapsed-inventory",
    "crates/synapsed",
    "crates/synapsed-client",
    "crates/synapsectl",
    "apps/macos-tray",
]
default-members = ["crates/synapsed", "crates/synapsed-client", "crates/synapsectl"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cast_lossless = "warn"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "=1.2.3", features = ["derive"] }
tokio = { version = "=1.54.1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
url = "=2.5.8"
toml = "=1.1.8"
clap = { version = "=4.6.7", features = ["derive"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json"] }
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["connect", "handshake"] }
futures-util = "=0.3.34"
tempfile = "3"
sha2 = "0.11"
libc = "0.2"
tracing = "0.1"

