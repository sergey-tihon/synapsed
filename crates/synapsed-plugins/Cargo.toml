[package]
name = "synapsed-plugins"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
synapsed-api = { path = "../synapsed-api" }
synapsed-core = { path = "../synapsed-core" }
synapsed-ddc = { path = "../synapsed-ddc" }
mlua = { version = "=0.12.2", features = ["lua54", "vendored", "async", "serde"] }
tokio = { version = "=1.54.1", features = ["rt", "sync", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
tracing = "0.1"
libc = "0.2"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
