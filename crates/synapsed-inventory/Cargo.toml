[package]
name = "synapsed-inventory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "lib.rs"

[lints]
workspace = true

[dependencies]
synapsed-api = { path = "../synapsed-api" }
sha2.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "=5.19.0", features = ["blocking"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "=0.6.3", default-features = false, features = ["std"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["CFDictionary", "CFNumber", "CFString"] }
objc2-io-kit = { version = "=0.3.2", default-features = false, features = ["libc", "std", "usb"] }
objc2-io-bluetooth = { version = "=0.3.2", default-features = false, features = ["Bluetooth", "IOBluetoothDevice", "IOBluetoothObject", "IOBluetoothHostController", "objc2", "objc2-foundation", "std"] }
objc2-core-bluetooth = { version = "=0.3.2", default-features = false, features = ["CBManager"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSArray", "NSObject", "NSString"] }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
