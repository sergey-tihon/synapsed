[package]
name = "synapsed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["web-ui"]
web-ui = ["dep:include_dir", "dep:mime_guess"]

[dependencies]
synapsed-api = { path = "../synapsed-api" }
synapsed-core = { path = "../synapsed-core" }
synapsed-ddc = { path = "../synapsed-ddc" }
synapsed-plugins = { path = "../synapsed-plugins" }
synapsed-inventory = { path = "../synapsed-inventory" }
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
clap.workspace = true
fs2 = "0.4"
futures-util.workspace = true
hostname = "0.4"
include_dir = { version = "0.7.4", optional = true }
mime_guess = { version = "2.0", optional = true }
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["registry"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
synapsed-ddc = { path = "../synapsed-ddc", features = ["test-support"] }
reqwest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite.workspace = true
